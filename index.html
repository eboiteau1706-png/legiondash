let mi=4,musLast=-1;
function musicTick(){
  const wi=Math.floor(level/10)%MUS.length,m=MUS[wi];
  if(wi!==musLast){musLast=wi;mStep=0;mi=m.lo}
  if(!(S.muted||S.nomusic||!AC||AC.state!=='running'||!musOut)){
    mStep++;
    const n=m.sc.length,st=mStep%8,bar=Math.floor(mStep/8)%4,sec=m.ms/1000;
    const deg=i=>m.r*Math.pow(2,(m.sc[((i%n)+n)%n]+12*Math.floor(i/n))/12);
    const cr=m.prog[bar],h=(mStep*2654435761>>>0)%100;
    if(m.drone&&st===0)pad(m.r/2,sec*7.5,0.1,musOut);
    if(m.pad&&st===0){[0,2,4].forEach(o=>pad(deg(cr+o)*(o?1:0.5),sec*7.5,0.045,musOut))}
    if(m.bs&&st%m.bs===0)tone(deg(cr)/2,sec*(m.bs>2?3:1.6),m.bw,m.bv,0,0,musOut);
    if(m.thud&&(st===0||st===4))tone(60,.45,'sine',.18,.5,0,musOut);
    if(m.arp){tone(deg(cr+[0,1,2,1][st%4]+n),m.md,m.mw,m.mv,0,0,musOut)}
    else if(h<m.mp*100&&(m.md>1||st%2===0||m.mp>.6)){
      mi=clamp(mi+((h%3)-1)+(h%7===0?2:0),m.lo,m.hi);
      tone(deg(mi),m.md,m.mw,m.mv,0,0,musOut);
    }
  }
  setTimeout(musicTick,m.ms);
}

function seedRng(sd){
  let a=(sd*2654435761)>>>0;
  rng=()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
}

const MKINDS=['slime','imp','cyclop'];MONS.men=ENEMY;
let levelMod='',VIS=2300,levelOK=true;
function build(L){
  seedRng(L*7919+13);
  const out=[];let zz=520,nb=10,nt=10;
  const PR=(typeof window!=='undefined'&&window.__PR)||(0.6+0.32*Math.min(1,L/500));
  const diff=1-Math.exp(-L/20),hd=HARD(L);
  const segs=7+Math.min(Math.floor(L/2),12);
  levelMod=(L>=10&&rng()<0.05+0.15*diff)?'fog':'';
  const sn=a=>a[Math.floor(rng()*a.length)];
  const mkGood=()=>rng()<0.4?{op:'x',v:(L>=4&&rng()<0.3)?3:2}:{op:'+',v:Math.max(4,Math.round(nb*(0.2+rng()*0.5)))};
  const mkBad=()=>(L>=5&&rng()<0.28)?{op:'/',v:2}:{op:'-',v:Math.max(4,Math.round(nb*(0.15+rng()*0.35)))};
  const mkClose=()=>{
    const mult=(L>=4&&rng()<0.35)?3:2,tol=0.30-0.22*diff;
    return[{op:'x',v:mult},{op:'+',v:Math.max(2,Math.round(nb*(mult-1)*(1-tol+rng()*2*tol)))}];
  };
  const coinLine=(x0,z0,cnt,gap,wave)=>{
    for(let c=0;c<cnt;c++)out.push({t:'coin',z:z0+c*gap,x:clamp(x0+(wave?wave*Math.sin(c*0.8):0),-LIM,LIM)});
  };
  const W=Math.floor(L/10),mons=MKINDS.slice(0,Math.min(W,3));
  const pickKind=()=>(!mons.length||rng()<0.4)?'men':sn(mons);
  const trap=(zt,x)=>{
    const all=['saw','spikes','hammer','twin'],opts=all.slice(0,Math.min(W+1,4));if(W>0)opts.push(all[Math.min(W,3)]);
    if(L>=100){const tier=Math.min(5,Math.floor((L-100)/50)+1);const ex=['fire','laser','boulder','mine','fence'].slice(0,tier);opts.push(...ex,ex[tier-1],ex[tier-1])}
    const t=sn(opts);
    if(t==='fire'){const h=x<0?[-ROAD,25]:[-25,ROAD];out.push({t:'fire',z:zt,x1:h[0],x2:h[1],ph:rng()})}
    else if(t==='laser')out.push({t:'laser',z:zt,gx:rnd(-90,90),ph:rng()});
    else if(t==='boulder')out.push({t:'boulder',z:zt,spd:0.55+diff*0.25,ph:rng()});
    else if(t==='mine'){const sc=rnd(-70,70);out.push({t:'mine',z:zt,xs:[sc-125,sc-70,sc+70,sc+125,sc-180,sc+180].filter(m=>Math.abs(m)<150&&rng()<0.85)})}
    else if(t==='fence')out.push({t:'fence',z:zt,amp:rnd(50,95),ph:rng()*TAU});
    else if(t==='saw')out.push({t:'saw',z:zt,amp:rnd(60,100),spd:1.2+diff*0.5,ph:rng()*TAU});
    else if(t==='twin')out.push({t:'saw',twin:true,z:zt,amp:rnd(70,100),spd:1.1+diff*0.4,ph:rng()*TAU});
    else if(t==='spikes'){const h=x<0?[-ROAD,25]:[-25,ROAD];out.push({t:'spikes',z:zt,len:70,x1:h[0],x2:h[1]})}
    else out.push({t:'hammer',z:zt,x:x<0?-55:55,ph:rng()*TAU});
  };
  const pairSeg=haz=>{
    const r=rng();let A,B;
    if(r<0.55-0.45*diff){A=mkGood();B=mkBad()}
    else if(r<0.85-0.2*diff||L<3){[A,B]=mkClose()}
    else if(L>=6&&diff>0.5&&r>0.93){A={op:'/',v:2};B={op:'-',v:Math.max(2,Math.round(nb*(0.45+rng()*0.1)))}}
    else{A=mkGood();B=mkGood()}
    const flip=rng()<0.5;
    const gs=(apply(A,nb)>=apply(B,nb))?(flip?1:-1):(flip?-1:1);
    if(haz&&L>=4&&rng()<0.1+0.3*diff){zz+=60;trap(zz-190,gs)}
    out.push({t:'gates',z:zz,L:flip?B:A,R:flip?A:B});
    nb=Math.max(apply(A,nb),apply(B,nb));
    {const a1=apply(A,nt),b1=apply(B,nt);nt=PR*Math.max(a1,b1)+(1-PR)*Math.min(a1,b1)}
    if(rng()<0.5)coinLine((rng()<0.6?gs:-gs)*72,zz-210,4,34,0);
    zz+=400;
  };
  const triSeg=()=>{
    const ops=diff<0.35?[mkGood(),mkClose()[1],mkBad()]:[{op:'x',v:2},{op:'+',v:Math.max(2,Math.round(nb*(0.88+rng()*0.06)))},{op:'+',v:Math.max(2,Math.round(nb*(1.06+rng()*0.08)))}];
    for(let i=2;i>0;i--){const j=Math.floor(rng()*(i+1));[ops[i],ops[j]]=[ops[j],ops[i]]}
    out.push({t:'gates3',z:zz,G:ops});
    nb=Math.max(...ops.map(o=>apply(o,nb)));
    {const v=ops.map(o=>apply(o,nt)).sort((a,b)=>b-a);nt=PR*v[0]+(1-PR)*0.7*v[1]+(1-PR)*0.3*v[2]}
    coinLine(rng()<0.5?-100:100,zz-200,4,34,0);
    zz+=420;
  };
  const enemySeg=()=>{
    const m=Math.max(3,Math.round(nt*Math.min(0.2+0.18*diff+0.25*hd,0.65)));
    out.push({t:'enemy',z:zz,n:m,kind:pickKind()});
    nb=Math.max(1,nb-m);nt=Math.max(1,nt-m);
    if(rng()<0.3)coinLine(0,zz+110,4,28,60);
    zz+=450;
  };
  const duelSeg=()=>{
    const m=Math.max(4,Math.round(nt*Math.min(0.22+0.18*diff+0.22*hd,0.64)));
    const small=Math.max(2,Math.round(m*0.6)),big=Math.round(m*1.25),sw=rng()<0.5;
    out.push({t:'duel',z:zz,a:{n:sw?small:big,kind:pickKind()},b:{n:sw?big:small,kind:pickKind()}});
    nb=Math.max(1,nb-small);nt=Math.max(1,nt-small);zz+=450;
  };
  const miniSeg=()=>{
    const m=Math.max(6,Math.round(nt*(0.3+0.2*diff+0.2*hd)));
    out.push({t:'enemy',kind:'giant',z:zz,n:m});
    nb=Math.max(1,nb-m);nt=Math.max(1,nt-m);zz+=460;
  };
  const trapSeg=()=>{
    const cnt=1+(diff>0.5?1:0)+(diff>0.85?1:0)+(hd>0.5?1:0);
    zz+=60;
    for(let i=0;i<cnt;i++)trap(zz+i*170,rng()<0.5?-1:1);
    coinLine(0,zz,cnt*4,32,0);
    zz+=cnt*170+260;
  };
  const padSeg=()=>{
    out.push({t:'pad',kind:'boost',z:zz+20,len:100,x1:-ROAD,x2:ROAD});
    coinLine(0,zz+40,6,30,50);
    if(L>=3){
      out.push({t:'saw',z:zz+300,amp:rnd(60,95),spd:1.5+diff,ph:rng()*TAU});
      if(diff>0.4)out.push({t:'saw',z:zz+370,amp:rnd(60,95),spd:1.7+diff,ph:rng()*TAU});
    }
    zz+=480;
  };
  let last='',since=0,mini=false;
  for(let i=0;i<segs;i++){
    let t;
    if(L===1&&i<2)t='pair';
    else if(since>=3||(L===1&&i===2))t=(L>=3&&rng()<0.45)?'duel':'enemy';
    else{
      const W2=[['pair',4],['tri',L>=3?2.2:0],['chain',L>=6?1+1.5*diff:0],['rush',L>=12?1.2*diff:0],['trap',L>=3?0.5+1.0*diff:0],['mini',(L>=8&&!mini&&i>=segs/2)?2:0]].filter(w=>w[1]>0);
      const c1=W2.filter(w=>w[0]!==last),pool=c1.length?c1:W2;
      let tot=0;for(const w of pool)tot+=w[1];
      let r=rng()*tot;t=pool[pool.length-1][0];
      for(const w of pool){r-=w[1];if(r<=0){t=w[0];break}}
    }
    if(t==='pair')pairSeg(true);
    else if(t==='tri')triSeg();
    else if(t==='chain'){pairSeg(false);zz-=160+50*diff;pairSeg(false)}
    else if(t==='rush'){for(let q=0;q<3;q++){pairSeg(false);if(q<2)zz-=170+50*diff}}
    else if(t==='enemy')enemySeg();
    else if(t==='duel')duelSeg();
    else if(t==='mini'){miniSeg();mini=true}
    else if(t==='trap')trapSeg();
    else padSeg();
    since=(t==='enemy'||t==='duel'||t==='mini')?0:since+1;
    last=t;
  }
  zz+=140;
  const bf=Math.min(0.35+0.3*diff+0.25*hd,0.9);
  out.push({t:'boss',z:zz,n:Math.max(6,Math.round(nt*bf)),kind:(W?['giant','horde','mixed']:['giant','horde'])[L%(W?3:2)],mon:mons.length?mons[(L*7)%mons.length]:'men'});
  endZ=zz;
  const hz=out.filter(e=>TRAPS.has(e.t));
  const onTrap=c=>hz.some(h=>{
    if(h.t==='saw')return Math.abs(c.z-h.z)<55;
    if(h.t==='spikes')return c.z>h.z-35&&c.z<h.z+h.len+35&&c.x>h.x1-22&&c.x<h.x2+22;
    if(h.t==='hammer')return Math.abs(c.z-h.z)<55&&Math.abs(c.x-h.x)<55;
    return Math.abs(c.z-h.z)<55;
  });
  const list=out.filter(e=>e.t!=='coin'||!onTrap(e));
  for(const e of list)e.tz=(e.t==='enemy'||e.t==='boss'||e.t==='duel')?e.z-90:e.z;
  list.sort((a,b)=>a.tz-b.tz);
  // late game: absolute sizes grow beyond the typical path (still verified below)
  {const mu=1+2.5*HARD(L)+0.6*Math.min(1,L/800);if(mu>1)for(const e of list){
    if(e.t==='enemy')e.n=Math.round(e.n*mu);
    else if(e.t==='duel'){e.a.n=Math.round(e.a.n*mu);e.b.n=Math.round(e.b.n*mu)}
    else if(e.t==='boss')e.n=Math.round(e.n*mu)}}
  // verify-and-relax: the level must stay winnable for imperfect players
  const rankG=g=>g.op==='/'?0:g.op==='-'?1-g.v/1e6:g.op==='+'?2+g.v/(g.v+1e9):3+g.v;
  const hh=HARD(L),fe=L<3?0:0.12+0.38*hh,fb=L<3?0:0.35+0.5*hh;
  const simRun=(mode,err,sd)=>{
    let r=sd>>>0;const rn=()=>{r=(r*1664525+1013904223)>>>0;return r/4294967296};
    let v=10;
    for(const e of list){
      if(e.t==='gates'){
        const a=apply(e.L,v),b=apply(e.R,v);
        if(mode==='naive')v=rankG(e.L)>=rankG(e.R)?a:b;
        else v=rn()<err?Math.min(a,b):Math.max(a,b);
      }else if(e.t==='gates3'){
        const vs=e.G.map(g=>apply(g,v));
        if(mode==='naive'){let bi=0;e.G.forEach((g,i)=>{if(rankG(g)>rankG(e.G[bi]))bi=i});v=vs[bi]}
        else{const o=[0,1,2].sort((i,j)=>vs[j]-vs[i]);v=rn()<err?vs[o[rn()<0.75?1:2]]:vs[o[0]]}
      }else if(e.t==='enemy'){v-=Math.max(e.n,Math.ceil(fe*v));if(v<=0)return false}
      else if(e.t==='duel'){const sm=Math.min(e.a.n,e.b.n),bg=Math.max(e.a.n,e.b.n);v-=Math.max((mode!=='naive'&&rn()<err)?bg:sm,Math.ceil(fe*v));if(v<=0)return false}
      else if(TRAPS.has(e.t)){v=Math.max(1,Math.floor(v*(mode==='naive'?0.8:rn()<0.6?0.8:1)))}
      else if(e.t==='boss')return v>Math.max(e.n,Math.ceil(fb*v));
    }
    return true;
  };
  const okLevel=()=>{
    if(L>=10?!(simRun('mc',0,5)&&simRun('mc',0,11)&&simRun('mc',0,17)):!simRun('naive',0,1))return false;
    let w=0;for(let i=0;i<40;i++)if(simRun('mc',0.3,i*7919+L))w++;
    if(w<Math.max(2,Math.round(36-60*hd)))return false;
    let w2=0;for(let i=0;i<40;i++)if(simRun('mc',0.5,i*104729+L))w2++;
    return w2>=Math.max(0,Math.round(22-40*hd));
  };
  for(let it=0;it<(L>=10?4:16)&&!okLevel();it++){
    for(const e of list){
      if(e.t==='enemy')e.n=Math.max(3,Math.floor(e.n*0.85));
      else if(e.t==='duel'){e.a.n=Math.max(2,Math.floor(e.a.n*0.85));e.b.n=Math.max(3,Math.floor(e.b.n*0.85))}
      else if(e.t==='boss')e.n=Math.max(6,Math.floor(e.n*0.85));
    }
  }
  // fallback: still not safe -> remove punishing gates and shrink further
  for(let it=0;it<(L>=10?8:30)&&!okLevel();it++){
    for(const e of list){
      const fix=g=>{if(g.op==='/'||g.op==='-'){g.op='+';g.v=6}};
      if(e.t==='gates'){fix(e.L);fix(e.R)}
      else if(e.t==='gates3')e.G.forEach(fix);
      else if(e.t==='enemy')e.n=Math.max(1,Math.floor(e.n*(L>=10?0.92:0.8)));
      else if(e.t==='duel'){const q=L>=10?0.92:0.8;e.a.n=Math.max(1,Math.floor(e.a.n*q));e.b.n=Math.max(1,Math.floor(e.b.n*q))}
      else if(e.t==='boss')e.n=Math.max(3,Math.floor(e.n*(L>=10?0.92:0.8)));
    }
  }
  // last resort: guarantee the level is winnable
  for(let it=0;it<80&&!okLevel();it++){
    for(const e of list){
      if(e.t==='enemy')e.n=Math.max(1,Math.floor(e.n*0.85));
      else if(e.t==='duel'){e.a.n=Math.max(1,Math.floor(e.a.n*0.85));e.b.n=Math.max(1,Math.floor(e.b.n*0.85))}
      else if(e.t==='boss')e.n=Math.max(3,Math.floor(e.n*0.85));
    }
  }
  levelOK=okLevel();
  return list;
}

  if(gPulse>0)gPulse=Math.max(0,gPulse-dt*4);

  pops=pops.filter(p=>p.t<0.9);
  if(flash){flash.t-=dt;if(flash.t<=0)flash=null}
  if(fx){fx.t-=dt;if(fx.t<=0)fx=null}
  const target=fx?(fx.kind==='boost'?1.9:0.55):1;

        }
      }else if(e.t==='spikes'){

      }else if(e.t==='fire'){

        {const hh=HARD(level),f=level<3?0:(e.t==='boss'?0.35+0.5*hh:0.12+0.38*hh);

        fight={e,t:0,dur:1.1,pn:n,en:sd?sd.n:e.n,sd};fightSnd=0;
        break;
      }

}

}

function drawGate(e){

  for(const [g,x1,x2] of list){

    ctx.lineWidth=Math.max(2,size*0.12);ctx.strokeStyle='rgba(10,20,40,.55)';ctx.lineJoin='round';
    const t=label(g);
    { const mw=(xr-xl)*0.9; const tw=ctx.measureText(t).width; if(tw>mw){ctx.font=(size*mw/tw)+'px '+FONT} }
    ctx.strokeText(t,(xl+xr)/2,y-h*0.5);

function hpBar(x,y,w,f){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(x-w/2-2,y-8,w+4,16,8);ctx.fill();
  ctx.fillStyle='#ff4a3a';ctx.beginPath();ctx.roundRect(x-w/2,y-6,Math.max(8,w*clamp(f,0,1)),12,6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x-w/2+4,y-5,Math.max(0,w*clamp(f,0,1)-8),3);
}
function drawEnemy(e,ec){
  const dz=e.z-z;
  if(dz>VIS||dz<-60)return;
  const cnt=ec!=null?ec:e.n;
  if(cnt<=0)return;
  const rec=fight&&fight.e===e;
  const s=sOf(dz+30),y0=yOf(s);
  if(e.kind==='giant'){
    const r=(e.t==='boss'?44:36)*k*s;
    giantOn(ctx,cx,y0,r);
    if(rec)for(let i=0;i<8;i++)enemyPts.push([cx+(Math.random()-.5)*r*1.4,y0-r*(0.8+Math.random()*2.4),r*0.4]);
    if(dz<650){hpBar(cx,y0-r*4.6-10,Math.max(90,r*3),cnt/e.n);
    pill(cx,y0-r*4.6-38,fmt(cnt),'#c4271f',e.t==='boss'?28:24)}
  }else if(e.t==='boss'){
    const mk=MONS[e.mon],mixed=e.kind==='mixed';
    if(mixed)dotOn(ctx,cx,y0-6*k*s,34*k*s,mk);
    recordInto=rec?enemyPts:null;const c=crowd(cnt,0,dz,mk,mixed?18:30,mixed?15:14,null,13,true);
    const top=Math.min(c.top,mixed?y0-34*k*s*3.4:c.top);
    if(dz<650)pill(cx,top-8,fmt(cnt),'#c4271f',26);
  }else{
    const sk=e.kind&&e.kind!=='men'?MONS[e.kind]:ENEMY;
    recordInto=rec?enemyPts:null;const c=crowd(cnt,0,dz,sk,30,14,null,12,true);
    if(dz<650)pill(c.x,c.top-6,fmt(cnt),'#d8352d',22);
  }
}
function drawDuel(e,sel,cnt){
  const dz=e.z-z;
  if(dz>VIS||dz<-60)return;
  for(const [g,x] of [[e.a,-62],[e.b,62]]){
    const c0=(sel===g&&cnt!=null)?cnt:g.n;
    if(c0<=0)continue;
    const sk=g.kind&&g.kind!=='men'?MONS[g.kind]:ENEMY;
    recordInto=(fight&&fight.e===e&&fight.sd===g)?enemyPts:null;const c=crowd(c0,x,dz,sk,18,11,null,10.5,true);
    if(dz<650)pill(c.x,c.top-6,fmt(c0),'#d8352d',20);
  }
}
function shotEnds(q){
  const A=q.e?enemyPts:playerPts,B=q.e?playerPts:enemyPts;
  const sp=A.length?A[q.si%A.length]:null,tp=B.length?B[q.ti%B.length]:null;
  if(sp){q.x=sp[0];q.y=sp[1]}if(tp){q.tx=tp[0];q.ty=tp[1]}
}
function drawShot(q){
  if(q.t<0)return;shotEnds(q);
  for(const gh of [0.2,0.12,0.06]){if(q.t/q.life-gh>0.02){ctx.globalAlpha=0.22*(1-gh*3);drawShot1(q,q.t/q.life-gh)}}
  ctx.globalAlpha=1;drawShot1(q,q.t/q.life);
}
function drawShot1(q,uu){
  const u=clamp(uu,0,1),thrown=q.wp==='rock'||q.wp==='goo'||q.wp==='axe'||q.wp==='crown'||q.wp==='shuriken'||q.wp==='heart'||q.wp==='cannon'||q.wp==='staff';
  const x=q.x+(q.tx-q.x)*u+(thrown?Math.sin(u*Math.PI)*q.sd*26*k:0),y=q.y+(q.ty-q.y)*u-(thrown?Math.sin(u*Math.PI)*34*k:0),r=k*(19-9*u),c=ctx,w=q.wp;
  const dx=q.tx-q.x,dy=q.ty-q.y,ang=Math.atan2(dy,dx);
  c.save();c.translate(x,y);
  if(w==='pistol'||w==='rifle'||w==='flint'){c.rotate(ang);c.strokeStyle='rgba(255,226,122,.35)';c.lineWidth=r*0.4;c.lineCap='round';c.beginPath();c.moveTo(-r*2.2,0);c.lineTo(0,0);c.stroke();c.fillStyle=w==='flint'?'#222':'#fff3b0';c.beginPath();c.arc(0,0,r*(w==='flint'?0.5:0.32),0,TAU);c.fill()}
  else if(w==='laser'||w==='ray'){c.rotate(ang);const col=w==='laser'?'#4af0ff':'#7dffb0';c.lineCap='round';c.strokeStyle=col;c.globalAlpha=0.35;c.lineWidth=r*0.9;c.beginPath();c.moveTo(-r*3,0);c.lineTo(r*0.5,0);c.stroke();c.globalAlpha=1;c.lineWidth=r*0.3;c.strokeStyle='#fff';c.beginPath();c.moveTo(-r*3,0);c.lineTo(r*0.5,0);c.stroke();if(w==='ray'){c.fillStyle=col;c.beginPath();c.arc(r*0.5,0,r*0.55,0,TAU);c.fill()}}
  else if(w==='shuriken'){c.rotate(uu*34+q.rot);c.shadowColor='#bfe6ff';c.shadowBlur=8;c.fillStyle='#dfe6ee';c.strokeStyle='#0a1424';c.lineWidth=2;c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*0.3:r*0.9;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fill();c.stroke()}
  else if(w==='axe'){c.rotate(q.t*22);c.strokeStyle='#7a4a22';c.lineWidth=r*0.28;c.lineCap='round';c.beginPath();c.moveTo(-r*0.9,0);c.lineTo(r*0.8,0);c.stroke();c.fillStyle='#cfd6df';c.strokeStyle='#0a1424';c.lineWidth=2;c.beginPath();c.moveTo(r*0.35,-r*0.1);c.lineTo(r*0.4,-r*0.95);c.lineTo(r*0.95,-r*0.8);c.lineTo(r*0.9,0);c.closePath();c.fill();c.stroke()}
  else if(w==='crown'){c.rotate(q.t*14);const h=r*0.8;c.fillStyle='#ffd34d';c.strokeStyle='#9a6200';c.lineWidth=2;c.beginPath();c.moveTo(-h,h*0.7);c.lineTo(-h,-h*0.6);c.lineTo(-h*0.5,0);c.lineTo(0,-h*0.95);c.lineTo(h*0.5,0);c.lineTo(h,-h*0.6);c.lineTo(h,h*0.7);c.closePath();c.fill();c.stroke();c.fillStyle='#ff4a6a';c.beginPath();c.arc(0,h*0.2,h*0.16,0,TAU);c.fill()}
  else if(w==='heart'){c.rotate(Math.sin(q.t*14)*0.3);const h=r*0.55;c.fillStyle='#ff4f9a';c.beginPath();c.moveTo(0,h*0.9);c.bezierCurveTo(-h*1.6,-h*0.2,-h*0.7,-h*1.3,0,-h*0.5);c.bezierCurveTo(h*0.7,-h*1.3,h*1.6,-h*0.2,0,h*0.9);c.fill();c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.arc(-h*0.4,-h*0.35,h*0.18,0,TAU);c.fill()}
  else if(w==='cannon'){for(let i=0;i<6;i++){const a=q.rot+i*1.05,d=r*(0.4+0.9*u)*(0.6+0.4*((i*7)%3)/2);c.fillStyle=['#ff4a6a','#4ad0ff','#ffd34d','#7dff7a','#c27bff','#ff9bd0'][i];c.save();c.translate(Math.cos(a)*d,Math.sin(a)*d);c.rotate(a*3+q.t*10);c.fillRect(-r*0.18,-r*0.09,r*0.36,r*0.18);c.restore()}}
  else if(w==='staff'){const g=c.createRadialGradient(0,0,0,0,0,r*1.4);g.addColorStop(0,'#fff3b0');g.addColorStop(0.35,'#ff9a2a');g.addColorStop(1,'rgba(255,60,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,r*1.4,0,TAU);c.fill()}
  else if(w==='ebullet'){c.rotate(ang);c.strokeStyle='rgba(255,120,60,.45)';c.lineWidth=r*0.35;c.lineCap='round';c.beginPath();c.moveTo(-r*2,0);c.lineTo(0,0);c.stroke();c.fillStyle='#ffb07a';c.beginPath();c.arc(0,0,r*0.3,0,TAU);c.fill()}
  else if(w==='goo'){const sq=1+0.2*Math.sin(uu*30);c.fillStyle='#5fdc6a';c.strokeStyle='#1a5a24';c.lineWidth=2;c.beginPath();c.ellipse(0,0,r*0.6*sq,r*0.6/sq,0,0,TAU);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.arc(-r*0.2,-r*0.2,r*0.14,0,TAU);c.fill()}
  else if(w==='ifire'){const g=c.createRadialGradient(0,0,0,0,0,r*1.2);g.addColorStop(0,'#fff0ff');g.addColorStop(0.4,'#e86ad4');g.addColorStop(1,'rgba(160,30,180,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,r*1.2,0,TAU);c.fill()}
  else if(w==='eye'){c.rotate(ang);c.lineCap='round';c.strokeStyle='rgba(255,90,40,.45)';c.lineWidth=r*0.9;c.beginPath();c.moveTo(-r*3,0);c.lineTo(r*0.4,0);c.stroke();c.strokeStyle='#ffe0a0';c.lineWidth=r*0.3;c.beginPath();c.moveTo(-r*3,0);c.lineTo(r*0.4,0);c.stroke()}
  else if(w==='rock'){c.rotate(uu*9);c.fillStyle='#8a7a68';c.strokeStyle='#2b2418';c.lineWidth=2;c.beginPath();for(let i=0;i<8;i++){const a=i*TAU/8,rr=r*(0.85+0.25*((i*5)%3)/2);c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.arc(-r*0.25,-r*0.25,r*0.25,0,TAU);c.fill()}
  else if(w==='bow'){c.rotate(ang);c.fillStyle='rgba(255,240,160,.4)';c.fillRect(-r*3,-r*0.1,r*3,r*0.2);c.strokeStyle='#fff7d0';c.lineWidth=r*0.18;c.beginPath();c.moveTo(-r*1.2,0);c.lineTo(r*0.6,0);c.stroke();c.fillStyle='#ffd34d';c.beginPath();c.moveTo(r*0.9,0);c.lineTo(r*0.4,-r*0.35);c.lineTo(r*0.4,r*0.35);c.fill()}
  c.restore();
}
function render(){
  const b=BIO();
  ctx.save();
  const shk=state==='fight'?5:state==='victory'?(vic.t<0.6?3:Math.max(0,1-(vic.t-0.6)/0.9)*16):0;
  if(shk)ctx.translate((Math.random()-.5)*shk,(Math.random()-.5)*shk);
  drawScene(b);
  drawParticles(b);
  for(let i=ents.length-1;i>=0;i--)if(ents[i].t==='pad')drawPad(ents[i]);
  enemyPts=[];playerPts=[];
  let pc=n,ec=null;
  if(fight){
    const t=clamp(fight.t/fight.dur,0,1),{pn,en}=fight;
    if(pn>en){pc=Math.round(pn-en*t);ec=Math.round(en*(1-t))}
    else{pc=Math.round(pn*(1-t));ec=Math.round(en-pn*t)}
  }
  for(let i=ents.length-1;i>=0;i--){
    const e=ents[i];
    if(e.t==='gates'||e.t==='gates3')drawGate(e);
    else if(e.t==='coin'){if(!e.done)drawCoin(e)}
    else if(e.t==='saw')drawSaw(e);
    else if(e.t==='spikes')drawSpikes(e);
    else if(e.t==='hammer')drawHammer(e);
    else if(e.t==='fire')drawFire(e);
    else if(e.t==='laser')drawLaser(e);
    else if(e.t==='boulder')drawBoulder(e);
    else if(e.t==='mine')drawMine(e);
    else if(e.t==='fence')drawFence(e);
    else if(e.t==='enemy'||e.t==='boss'){if(!e.done)drawEnemy(e,fight&&fight.e===e?ec:null)}
    else if(e.t==='duel'){if(!e.done)drawDuel(e,fight&&fight.e===e?fight.sd:null,ec)}
  }
  if(state==='victory'&&vic.t<0.6){ctx.save();ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6);drawEnemy(vic.e,Math.max(1,Math.round(vic.e.n*0.15*(1-vic.t/0.6))));ctx.restore()}
  const sk0=skinById(S.skin),jmp=state==='victory'&&vic.t>=0.6;
  if(jmp){ctx.save();ctx.translate(0,-Math.abs(Math.sin((vic.t-0.6)*8))*18)}
  if(gPulse>0){const gs=1+0.05*Math.sin(gPulse*Math.PI);ctx.save();ctx.translate(cx+px*k,base);ctx.scale(gs,gs);ctx.translate(-(cx+px*k),-base)}
  recordInto=playerPts;const c=crowd(pc,px,0,sk0,40,10.5,sk0.body,8.6);
  if(gPulse>0)ctx.restore();
  if(pc>0)pill(c.x,c.top-8,fmt(pc),'#1f6fd6',28);
  if(jmp)ctx.restore();
  for(const q of shots)drawShot(q);
  for(const p of pops){
    ctx.globalAlpha=Math.max(0,1-p.t/0.9);
    ctx.font='34px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(10,20,40,.6)';ctx.lineJoin='round';
    const y=c.top-48-p.t*70;
    ctx.strokeText(p.txt,c.x,y);ctx.fillStyle=p.col;ctx.fillText(p.txt,c.x,y);
    ctx.globalAlpha=1;
  }
  for(const r of rings){const u=r.t/r.life;ctx.globalAlpha=(1-u)*0.9;ctx.strokeStyle=r.c;ctx.lineWidth=r.w*(1-u)+1;ctx.beginPath();ctx.arc(r.x,r.y,r.r0+(r.r1-r.r0)*(1-Math.pow(1-u,3)),0,TAU);ctx.stroke()}
  ctx.globalAlpha=1;
  for(const p of parts){
    const u=p.t/p.life;
    if(p.k==='spark'){ctx.globalAlpha=1-u;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1-u*0.5),0,TAU);ctx.fill()}
    else if(p.k==='man'){const sc=Math.min(1,0.35+u*3),fa=u>0.7?(1-u)/0.3:1;ctx.globalAlpha=fa;ctx.save();ctx.translate(p.x,p.y);ctx.scale(sc,sc);
      ctx.fillStyle=p.c;ctx.strokeStyle='#0a1424';ctx.lineWidth=1.4;ctx.beginPath();ctx.roundRect(-p.r*0.8,-p.r*0.2,p.r*1.6,p.r*1.7,p.r*0.5);ctx.fill();ctx.stroke();
      ctx.fillStyle=p.h;ctx.beginPath();ctx.arc(0,-p.r*0.9,p.r*0.75,0,TAU);ctx.fill();ctx.stroke();ctx.restore()}
    else if(p.k==='conf'){ctx.globalAlpha=Math.min(1,(1-u)*2);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r*0.5,p.r*2,p.r);ctx.restore()}
    else{ctx.globalAlpha=Math.min(1,(1-u)*2);coinFace(p.x,p.y,p.r,Math.abs(Math.cos(p.t*9+p.ph)))}
  }
  ctx.globalAlpha=1;
  if(state==='victory'&&vic.t>=0.7){
    const u=Math.min(1,(vic.t-0.7)/0.5),c1=1.70158,e2=1+(c1+1)*Math.pow(u-1,3)+c1*Math.pow(u-1,2);
    ctx.save();ctx.translate(W/2,H*0.27);ctx.rotate(-0.06);ctx.scale(e2,e2);
    const fs=Math.min(W*0.16,72);
    ctx.font=fs+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=fs*0.18;ctx.strokeStyle='#0a1830';
    ctx.strokeText('BOSS',0,-fs*0.55);ctx.strokeText(tr('VAINCU !','DEFEATED!'),0,fs*0.55);
    const gg=ctx.createLinearGradient(0,-fs,0,fs);gg.addColorStop(0,'#fff6b0');gg.addColorStop(0.5,'#ffc61a');gg.addColorStop(1,'#ff8a00');
    ctx.fillStyle=gg;ctx.fillText('BOSS',0,-fs*0.55);ctx.fillText(tr('VAINCU !','DEFEATED!'),0,fs*0.55);
    ctx.restore();
  }
  if(wf>0){ctx.globalAlpha=wf*0.85;ctx.fillStyle='#fff';ctx.fillRect(-20,-20,W+40,H+40);ctx.globalAlpha=1}
  if(spd>1.35){
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;
    const oy=hor+(base-hor)*0.45;
    for(let i=0;i<18;i++){
      const a=Math.random()*TAU,r0=Math.max(W,H)*(0.28+Math.random()*0.2),r1=r0+Math.max(W,H)*(0.12+Math.random()*0.15);
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,oy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*r1,oy+Math.sin(a)*r1);ctx.stroke();
    }
  }
  if(spd<0.8){ctx.globalAlpha=(0.8-spd)*0.6;ctx.fillStyle='#7b3fd0';ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=1}
  if(flash){ctx.globalAlpha=Math.max(0,flash.t/0.25)*0.22;ctx.fillStyle=flash.c;ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=1}
  ctx.restore();
  {const vg=ctx.createRadialGradient(cx,H*0.55,H*0.28,cx,H*0.55,H*0.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.38)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
  if(state==='home')return;
  const bw=W-32;
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.roundRect(16,14,bw,9,5);ctx.fill();
  ctx.fillStyle='#ffd34d';
  ctx.beginPath();ctx.roundRect(16,14,Math.max(9,bw*clamp(z/endZ,0,1)),9,5);ctx.fill();
  ctx.font='800 15px '+BODYF;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='rgba(10,20,40,.55)';
  ctx.textAlign='left';
  const info=tr('Niveau ','Level ')+level+' · '+bioName()+(levelMod==='fog'?tr(' · Brouillard',' · Fog'):'');
  ctx.strokeText(info,16,40);ctx.fillStyle='#fff';ctx.fillText(info,16,40);
  ctx.textAlign='right';
  if(!replay){const ct=String(runCoins);
  ctx.strokeText(ct,W-34,40);ctx.fillText(ct,W-34,40);
  coinFace(W-24,40,8,1)}
}

let last=performance.now();
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  step(dt);render();
  requestAnimationFrame(loop);
}
updBank();
applyLang();
showHome();
if(document.fonts&&document.fonts.load)document.fonts.load('20px "Lilita One"').catch(()=>{});
requestAnimationFrame(loop);
})();
</script>
